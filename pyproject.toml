[project]
dependencies = [
  "aiortc>=1.11.0",
  "cartesia>=2.0.9",
  "pipecat-ai[artesia,daily,deepgram,openai,runner,silero,webrtc,websocket]>=0.0.83",
  "pipecatcloud>=0.2.4",
  "supabase>=2.0.0",
  "twilio>=9.0.0",
  "websocket-client>=1.8.0",
]
description = "Twilio phone bot example using Pipecat"
name = "pipecat-phone-bot-example"
requires-python = ">=3.10"
version = "0.1.0"

[dependency-groups]
dev = [
  "ruff~=0.12.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
